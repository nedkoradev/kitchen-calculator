name: Request pilot deployment after main update

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'nedkoradev/kitchen-calculator' &&
      vars.NEDIQ_PILOT_AUTO_DEPLOY == '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Request guarded pilot deployment of exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == nedkoradev/kitchen-calculator ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run pilot-deploy.yml --repo "$GH_REPO" --ref main -f release_sha="$RELEASE_SHA"
