name: Prepare approved NED-IQ v3 public candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the bootstrap image or deploy a later candidate
        type: choice
        required: true
        default: image-only
        options:
          - image-only
          - candidate

permissions:
  contents: read

concurrency:
  group: nediq-public-v3
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'nedkoradev/kitchen-calculator' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pr-checks.yml
    with:
      release_sha: ${{ github.sha }}

  candidate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: public-v3
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: kitchen-designer-9d437
      REGION: europe-west1
      SERVICE: nediq-v3-public
      RUNTIME_ACCOUNT: nediq-v3-public@kitchen-designer-9d437.iam.gserviceaccount.com
      IMAGE: europe-west1-docker.pkg.dev/kitchen-designer-9d437/nediq/nediq-v3-public
      WIF_PROVIDER: ${{ vars.PUBLIC_V3_WIF_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.PUBLIC_V3_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate public WIF configuration
        run: |
          set -euo pipefail
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "::error::Set PUBLIC_V3_WIF_PROVIDER in the public-v3 GitHub Environment to the full Google WIF provider resource name."
            exit 1
          fi
          if [[ "$DEPLOY_ACCOUNT" != "nediq-public-deployer@$PROJECT.iam.gserviceaccount.com" ]]; then
            echo "::error::Set PUBLIC_V3_DEPLOY_SERVICE_ACCOUNT in the public-v3 GitHub Environment to nediq-public-deployer@$PROJECT.iam.gserviceaccount.com."
            exit 1
          fi
      - name: Build the exact tested source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          bash tests/pilot-container-smoke.sh "$IMAGE:$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Publish or verify the immutable image
        id: image
        run: |
          set -euo pipefail
          immutable=$(gcloud artifacts repositories describe nediq --project "$PROJECT" --location "$REGION" --format='value(dockerConfig.immutableTags)')
          [[ "${immutable,,}" == true ]]
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          describe_tag() {
            gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project "$PROJECT" --format='value(image_summary.digest)'
          }
          if digest=$(describe_tag 2>"$RUNNER_TEMP/public-v3-registry.log") && [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "$IMAGE@$digest"
            label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")
            [[ "$label" == "$GITHUB_SHA" ]]
            bash tests/pilot-container-smoke.sh "$IMAGE@$digest"
          else
            docker push "$IMAGE:$GITHUB_SHA"
            digest=$(describe_tag)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Image: %s@%s\n\nCommit: %s\n' "$IMAGE" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy a ready revision with zero traffic
        if: inputs.mode == 'candidate'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          cloud=(--project "$PROJECT" --region "$REGION" --quiet)
          gcloud run services describe "$SERVICE" "${cloud[@]}" --format=json |
            jq -e --arg runtime "$RUNTIME_ACCOUNT" '
              .metadata.annotations["run.googleapis.com/ingress"] == "internal"
              and .metadata.annotations["run.googleapis.com/invoker-iam-disabled"] != "true"
              and .spec.template.spec.serviceAccountName == $runtime' >/dev/null
          suffix="gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          revision="$SERVICE-$suffix"
          gcloud run deploy "$SERVICE" "${cloud[@]}" --image "$IMAGE_REF" --no-traffic --revision-suffix "$suffix"
          gcloud run revisions describe "$revision" "${cloud[@]}" --format='json(spec.containers,spec.serviceAccountName,status.conditions)' |
            jq -e --arg image "$IMAGE_REF" --arg runtime "$RUNTIME_ACCOUNT" '
              .spec.containers[0].image == $image and .spec.serviceAccountName == $runtime
              and any(.status.conditions[]; .type == "Ready" and .status == "True")' >/dev/null
          gcloud run services describe "$SERVICE" "${cloud[@]}" --format='json(status.traffic)' |
            jq -e --arg revision "$revision" 'all(.status.traffic[]; .revisionName != $revision or (.percent // 0) == 0)' >/dev/null
          printf 'Ready revision %s has zero traffic.\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
