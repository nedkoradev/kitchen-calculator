name: Prepare approved NED-IQ v3 public candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the bootstrap image or deploy a later candidate
        type: choice
        required: true
        default: image-only
        options:
          - image-only
          - candidate

permissions:
  contents: read

concurrency:
  group: nediq-public-v3
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'nedkoradev/kitchen-calculator' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pr-checks.yml
    with:
      release_sha: ${{ github.sha }}

  candidate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: public-v3
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: kitchen-designer-9d437
      REGION: europe-west1
      SERVICE: nediq-v3-public
      RUNTIME_ACCOUNT: ned-iq-v3-public@kitchen-designer-9d437.iam.gserviceaccount.com
      IMAGE: europe-west1-docker.pkg.dev/kitchen-designer-9d437/nediq/nediq-v3-public
      WIF_PROVIDER: ${{ vars.PUBLIC_V3_WIF_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.PUBLIC_V3_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate public WIF configuration
        run: bash scripts/check-public-wif.sh
      - name: Build the exact tested source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          bash tests/pilot-container-smoke.sh "$IMAGE:$GITHUB_SHA"
          bash tests/public-container-smoke.sh "$IMAGE:$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Check effective Cloud Run access
        if: inputs.mode == 'candidate'
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.PUBLIC_V3_FIREBASE_WEB_API_KEY }}
        run: bash scripts/check-public-cloud-access.sh
      - name: Publish or verify the immutable image
        id: image
        run: |
          set -euo pipefail
          immutable=$(gcloud artifacts repositories describe nediq --project "$PROJECT" --location "$REGION" --format='value(dockerConfig.immutableTags)')
          [[ "${immutable,,}" == true ]]
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          describe_tag() {
            gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project "$PROJECT" --format='value(image_summary.digest)'
          }
          if digest=$(describe_tag 2>"$RUNNER_TEMP/public-v3-registry.log") && [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "$IMAGE@$digest"
            label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")
            [[ "$label" == "$GITHUB_SHA" ]]
            bash tests/pilot-container-smoke.sh "$IMAGE@$digest"
            bash tests/public-container-smoke.sh "$IMAGE@$digest"
          else
            docker push "$IMAGE:$GITHUB_SHA"
            digest=$(describe_tag)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Image: %s@%s\n\nCommit: %s\n' "$IMAGE" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the internal Cloud Run candidate
        if: inputs.mode == 'candidate'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          FIREBASE_WEB_API_KEY: ${{ secrets.PUBLIC_V3_FIREBASE_WEB_API_KEY }}
        run: bash scripts/deploy-public-candidate.sh
