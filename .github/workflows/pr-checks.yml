name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.release_sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 24 / unit, release, Chromium and diff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.release_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      KITCHEN_TEST_URL: http://127.0.0.1:8000/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check PR diff and pin release base
        run: |
          if [[ -n "$RELEASE_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BASE_SHA" HEAD
          fi
          git update-ref refs/remotes/origin/main "$BASE_SHA"
      - name: Require a higher version for v3 runtime changes
        run: |
          if [[ -n "$RELEASE_SHA" ]]; then
            node scripts/check-v3-version.mjs "$(git rev-parse HEAD^)"
          else
            node scripts/check-v3-version.mjs "$BASE_SHA"
          fi
          bash tests/v3-version-guard.sh
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: |
          node --test --test-isolation=none tests/public-workflow.test.mjs
          node --test --test-isolation=none tests/pilot-image-workflow.test.mjs
          npm test
      - name: Verify committed release metadata
        run: |
          npm run release:check
          git diff --exit-code
      - name: Install Chromium for browser tests
        run: |
          browser_dir="$RUNNER_TEMP/nediq-browser"
          npm install --prefix "$browser_dir" --no-save --package-lock=false playwright@1.58.2
          # ubuntu-24.04 already supplies the Chromium runtime libraries.
          "$browser_dir/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$browser_dir/node_modules" >> "$GITHUB_ENV"
          chromium_path=$(node -p 'require(process.argv[1]).chromium.executablePath()' "$browser_dir/node_modules/playwright")
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Run Chromium regressions
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/nediq-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused "$KITCHEN_TEST_URL" -o /dev/null
          node tests/help-browser.cjs
          node tests/dialog-drag-browser.cjs
          node tests/table-design-browser.cjs
          node tests/release-browser.cjs
          node tests/v288-workspace-browser.cjs
          node tests/workspace-controller-browser.cjs
          node tests/workspace-ui-browser.cjs
          node tests/workspace-real-editor-browser.cjs
          node tests/responsive-workspace-browser.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run legacy Firestore Emulator checks
        run: npm run test:firestore
      - name: Run authenticated v3 release checks and Chromium with Emulators
        run: npm run test:release-emulator
      - name: Test pilot bootstrap read-only and fail-closed behavior
        run: bash tests/bootstrap-pilot-mock.sh
      - name: Check public deployment identity validation
        run: bash tests/public-wif-smoke.sh
      - name: Test public Cloud Run bootstrap and updates
        run: |
          bash tests/public-deploy-smoke.sh
          bash tests/public-cloud-access-smoke.sh
      - name: Test production traffic promotion and rollback
        run: bash tests/public-production-smoke.sh
      - name: Test the pilot deployment guardrails with a local mock
        run: bash tests/pilot-deploy-smoke.sh
      - name: Build and exercise the disabled Cloud Run image
        run: |
          docker build -t nediq-pilot-check .
          bash tests/pilot-container-smoke.sh nediq-pilot-check
          bash tests/public-container-smoke.sh nediq-pilot-check
