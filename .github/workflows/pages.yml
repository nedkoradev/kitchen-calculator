name: pages build and deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # v2 GitHub Pages and v3 Cloud Run are independent public products.
    # Deploy the legacy v2.96 site on every main push even when v3 auto deploy is enabled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Measure the checked-out source files
        run: node scripts/repository-space.mjs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated statistics and release metadata
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {validSpaceStats} from './settings.mjs';
          const stats=JSON.parse(readFileSync('_site/repository-space.json','utf8'));
          const release=JSON.parse(readFileSync('_site/release.json','utf8'));
          if(!validSpaceStats(stats)||stats.revision!==process.env.GITHUB_SHA||release.revision!==stats.revision||release.version!==stats.version)throw Error('Invalid Pages metadata');
          const files=JSON.parse(readFileSync('_data/repository_space.json','utf8')).files;
          if(stats.totalBytes!==files.reduce((total,file)=>total+file.bytes,0)||stats.textureBytes!==files.filter(file=>file.texture).reduce((total,file)=>total+file.bytes,0)||stats.imageCount!==files.filter(file=>file.image).length||stats.fileCount!==files.length)throw Error('Statistics do not match the measured source snapshot');
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const site = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (site.data.build_type !== 'workflow') {
              throw new Error('V2 GitHub Pages requires Settings > Pages > Build and deployment > Source: GitHub Actions. Change this as repository administrator; no admin override is permitted.');
            }
            if (site.data.cname) {
              core.error('Legacy v2 cannot be served from nedkoradev.github.io/kitchen-calculator/ while this Pages site has Custom domain: ' + site.data.cname);
              throw new Error('Remove the Custom domain in kitchen-calculator > Settings > Pages (leave the field blank and Save), while keeping Source = GitHub Actions. Do NOT change nediq.eu DNS or the v3 Cloud Run mapping. Then re-run the Pages workflow. This must be changed by a repository administrator.');
            }
            core.info('Legacy Pages has no custom domain; using the default nedkoradev.github.io/kitchen-calculator/ URL.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
