name: NED-IQ risk gate dry run

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number in nedkoradev/kitchen-calculator
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Use only code checked out from the protected control repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch target commits as data, without executing PR code
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]] || exit 1
          git init --bare "$RUNNER_TEMP/nediq-target.git"
          git -C "$RUNNER_TEMP/nediq-target.git" remote add origin https://github.com/nedkoradev/kitchen-calculator.git
          git -C "$RUNNER_TEMP/nediq-target.git" fetch --no-tags origin refs/heads/main "refs/pull/$PR_NUMBER/head"
          node risk-gate-prototype/github-dry-run.mjs "$RUNNER_TEMP/nediq-target.git" "$PR_NUMBER"
