<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Calculator</title>
<style>
:root{font-family:Arial,sans-serif;color:#13233a;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#14263d;color:#fff;padding:18px max(18px,calc((100% - 1200px)/2))}header h1{margin:0;font-size:28px}header p{margin:5px 0 0}.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.top{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border:1px solid #d5dde7;border-radius:14px;padding:16px;margin-bottom:18px}h2{margin:4px 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}.field label{display:block;font-size:13px;color:#617086;margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:9px;font-size:16px}.calc{margin-top:14px;background:#edf3f8;padding:12px;border-radius:10px;line-height:1.55}.hint{color:#65758b;margin-top:-8px}.viewer{height:590px;border-radius:10px;overflow:hidden;background:#eef2f5;position:relative}.viewer canvas{display:block;width:100%;height:100%;touch-action:none}.viewer .msg{position:absolute;left:12px;bottom:12px;background:#ffffffdd;padding:7px 10px;border-radius:7px;font-size:12px}.lower{display:grid;grid-template-columns:360px 1fr;gap:18px}.tabs button{margin:0 5px 6px 0;padding:7px 9px;border:0;border-radius:7px}.tabs .active{background:#173b66;color:#fff}.part{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;margin-top:10px}.rect{width:170px;height:120px;background:#e5e8eb;position:relative}.edge{position:absolute;background:#777;cursor:pointer}.edge.on{background:#d22}.edge[data-edge=top],.edge[data-edge=bottom]{left:0;width:100%;height:8px}.edge[data-edge=top]{top:0}.edge[data-edge=bottom]{bottom:0}.edge[data-edge=left],.edge[data-edge=right]{top:0;height:100%;width:8px}.edge[data-edge=left]{left:0}.edge[data-edge=right]{right:0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #d8dee6;text-align:left}tfoot{font-weight:bold}@media(max-width:760px){.top,.lower{grid-template-columns:1fr}.viewer{height:460px}.part{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}header h1{font-size:23px}}
</style></head><body>
<header><h1>Kitchen Calculator</h1><p>Долен кухненски шкаф — v2.0</p></header>
<div class="wrap"><div class="top">
<section class="card"><h2>Размери</h2><div class="fields">
<div class="field"><label>Ширина шкаф</label><input id="w" type="number" value="600"></div>
<div class="field"><label>Обща височина</label><input id="h" type="number" value="900"></div>
<div class="field"><label>Крака</label><input id="legs" type="number" value="100"></div>
<div class="field"><label>Плот — дебелина</label><input id="top" type="number" value="39"></div>
<div class="field"><label>ПДЧ</label><input id="t" type="number" value="18"></div>
<div class="field"><label>Крайна дълбочина</label><input id="d" type="number" value="555"></div>
<div class="field"><label>Гръб</label><input id="back" type="number" value="3"></div>
<div class="field"><label>Ширина царги</label><input id="rail" type="number" value="60"></div>
<div class="field"><label>Брой рафтове</label><input id="shelves" type="number" value="1"></div>
</div><div id="calc" class="calc"></div></section>
<section class="card"><h2>Конструкция — 3D модел</h2><p class="hint">Плъзни за завъртане · колелце/щипване за приближаване</p><div id="viewer" class="viewer"><div class="msg">Интерактивен модел</div></div></section>
</div>
<div class="lower">
<section class="card"><h2>Кантиране</h2><div id="tabs" class="tabs"></div><p>Натисни ръб — червено означава кант.</p><div class="part"><div class="rect"><i class="edge" data-edge="top"></i><i class="edge" data-edge="right"></i><i class="edge" data-edge="bottom"></i><i class="edge" data-edge="left"></i></div><div><b id="pname"></b><div id="psize"></div><div id="etxt"></div><div id="meters"></div></div></div></section>
<section class="card"><h2>Списък за разкрой</h2><div style="overflow:auto"><table><thead><tr><th>Детайл</th><th>Брой</th><th>Краен размер</th><th>Кантирани ръбове</th><th>Кант</th></tr></thead><tbody id="tbody"></tbody><tfoot><tr><td colspan="4">ОБЩО КАНТ</td><td id="total"></td></tr></tfoot></table></div></section>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), num=id=>Math.max(0,Number($(id).value)||0);
let selected='side';const edges={side:new Set(),bottom:new Set(),shelf:new Set(),rail:new Set(),back:new Set(),worktop:new Set()},names={top:'горе',right:'дясно',bottom:'долу',left:'ляво'};
function dims(){const w=num('w'),total=num('h'),legs=num('legs'),top=num('top'),t=num('t'),d=num('d'),back=num('back'),rail=num('rail'),shelves=Math.round(num('shelves')),body=Math.max(0,total-legs-top),pd=Math.max(0,d-back),sideH=Math.max(0,body-t),inner=Math.max(0,w-2*t);return{w,total,legs,top,t,d,back,rail,shelves,body,pd,sideH,inner}}
function parts(x){return{side:{n:'Страница',q:2,a:x.sideH,b:x.pd},bottom:{n:'Дъно',q:1,a:x.w,b:x.pd},shelf:{n:'Рафт',q:x.shelves,a:x.inner,b:x.pd},rail:{n:'Царга',q:2,a:x.inner,b:x.rail},back:{n:'Гръб '+x.back+' mm',q:1,a:x.w,b:x.body},worktop:{n:'Плот',q:1,a:x.w+70,b:x.d+45}}}
function band(k,p){let m=0;edges[k].forEach(e=>m+=(e==='top'||e==='bottom'?p.a:p.b));return m*p.q/1000}
function edgeText(k){const a=[...edges[k]].map(e=>names[e]);return a.length?a.join(', '):'няма'}
function ui(){const x=dims(),p=parts(x),q=p[selected];$('calc').innerHTML='<b>Корпус:</b> '+x.w+' × '+x.body+' × '+x.d+' mm<br><b>ПДЧ дълбочина:</b> '+x.pd+' mm<br><b>Страница:</b> '+x.sideH+' × '+x.pd+' mm<br><b>4 крака:</b> '+x.legs+' mm · <b>Плот:</b> '+x.top+' mm';$('tabs').innerHTML='';Object.entries(p).forEach(([k,z])=>{const b=document.createElement('button');b.textContent=z.n;b.className=k===selected?'active':'';b.onclick=()=>{selected=k;ui()};$('tabs').appendChild(b)});$('pname').textContent=q.n;$('psize').textContent=q.a+' × '+q.b+' mm';$('etxt').textContent='Кант: '+edgeText(selected);$('meters').textContent='Кант за '+q.q+' бр.: '+band(selected,q).toFixed(3)+' m';document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',edges[selected].has(e.dataset.edge)));let total=0;$('tbody').innerHTML='';Object.entries(p).forEach(([k,z])=>{if(!z.q)return;const m=band(k,z);total+=m;$('tbody').insertAdjacentHTML('beforeend','<tr><td>'+z.n+'</td><td>'+z.q+'</td><td>'+z.a+' × '+z.b+' mm</td><td>'+edgeText(k)+'</td><td>'+m.toFixed(3)+' m</td></tr>')});$('total').textContent=total.toFixed(3)+' m'}
document.querySelectorAll('.edge').forEach(e=>e.onclick=()=>{const s=edges[selected],k=e.dataset.edge;s.has(k)?s.delete(k):s.add(k);ui()});

const host=$('viewer');if(!window.THREE){host.innerHTML='<b style="padding:20px;display:block">Three.js не се зареди.</b>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef2f5);const camera=new THREE.PerspectiveCamera(38,1,1,10000);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x59636d,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(800,1200,900);scene.add(sun);
const wood=new THREE.MeshStandardMaterial({color:0xd7aa70,roughness:.7}),topMat=new THREE.MeshStandardMaterial({color:0x55585d,roughness:.72,metalness:0}),railMat=new THREE.MeshStandardMaterial({color:0xc98f50,roughness:.7}),legMat=new THREE.MeshStandardMaterial({color:0x30241f,roughness:.85}),backMat=new THREE.MeshStandardMaterial({color:0xc8a77b,roughness:.85,side:THREE.DoubleSide});
let model=new THREE.Group();scene.add(model);
function addBox(w,h,d,x,y,z,mat=wood){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);mesh.position.set(x,y,z);model.add(mesh);const line=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:0x5a422f}));line.position.copy(mesh.position);model.add(line)}
function build(){while(model.children.length){const o=model.children.pop();o.geometry?.dispose()}const x=dims(),{w:W,legs:L,top,Tp,t:T,pd:PD,back:B,rail:R,body:H,sideH:SH,inner:I,shelves:S,d:D}=x;
addBox(W,T,PD,0,L+T/2,0);addBox(T,SH,PD,-W/2+T/2,L+T+SH/2,0);addBox(T,SH,PD,W/2-T/2,L+T+SH/2,0);
for(let i=1;i<=S;i++)addBox(I,T,PD,0,L+T+SH*i/(S+1),0);
const ry=L+H-45-T/2;addBox(I,T,R,0,ry,PD/2-R/2,railMat);addBox(I,T,R,0,ry,-PD/2+R/2,railMat);
if(B)addBox(W,H,B,0,L+H/2,-PD/2-B/2,backMat);
const lw=42,ix=Math.max(45,W/2-60),iz=Math.max(45,PD/2-60);[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz])=>addBox(lw,L,lw,sx*ix,L/2,sz*iz,legMat));
{
 const vh=Tp;
 const g=new THREE.BoxGeometry(W,vh,600);
 const m=new THREE.Mesh(g,topMat);
 m.position.set(0,L+H-18,20);
 m.renderOrder=10;m.material.depthTest=true;m.material.depthWrite=true;
 model.add(m);
 const eg=new THREE.EdgesGeometry(g);
 const el=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x111111}));
 el.position.copy(m.position);el.renderOrder=11;model.add(el);
}
camera.position.set(W*1.35,L+H+320,Math.max(900,D*1.9));camera.lookAt(0,L+H*.52,0)}
let down=false,lx=0,ly=0,rx=-.12,ry=.42,scale=.58,pinch=0;function pose(){model.position.set(0,0,0);model.rotation.x=rx;model.rotation.y=ry;model.scale.setScalar(scale)}
const c=renderer.domElement;c.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!down)return;ry+=(e.clientX-lx)*.008;rx=Math.max(-.65,Math.min(.45,rx+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;pose()});c.addEventListener('pointerup',()=>down=false);c.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(1.5,scale*(e.deltaY>0?.92:1.08)));pose()},{passive:false});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{ui();build()}));resize();ui();build();pose();(function draw(){requestAnimationFrame(draw);renderer.render(scene,camera)})();
})();
</script></body></html>
