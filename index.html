<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Calculator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fa;color:#18212f}header{background:#17263a;color:#fff;padding:20px}.wrap{max-width:1180px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border:1px solid #d7dde5;border-radius:14px;padding:16px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#687386}input{width:100%;padding:10px;border:1px solid #d7dde5;border-radius:8px;font-size:16px;margin-top:4px}.calc{margin-top:14px;background:#eef3f8;padding:12px;border-radius:10px;line-height:1.6}svg{width:100%;max-height:520px}.partBtns{display:flex;flex-wrap:wrap;gap:8px}.partBtns button{padding:9px 12px;border:1px solid #d7dde5;background:#fff;border-radius:8px}.partBtns button.active{border-color:#1565c0;background:#e8f1fc;font-weight:700}.edge{stroke:transparent;stroke-width:20;cursor:pointer;pointer-events:stroke}.edge.on{stroke:#e53935;stroke-width:10}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #d7dde5}th{background:#eef3f8}@media(max-width:780px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body>
<header><div class="wrap" style="padding:0"><h1 style="margin:0">Kitchen Calculator</h1><div>Долен кухненски шкаф — v0.4</div></div></header><main class="wrap"><div class="grid"><section class="card"><h2>Размери</h2><div class="inputs">
<label>Ширина шкаф<input id="w" type="number" value="600"></label><label>Обща височина<input id="h" type="number" value="900"></label><label>Крака<input id="legs" type="number" value="100"></label><label>Плот — дебелина<input id="top" type="number" value="39"></label><label>ПДЧ<input id="t" type="number" value="18"></label><label>Крайна дълбочина<input id="d" type="number" value="555"></label><label>Гръб<input id="back" type="number" value="3"></label><label>Ширина царги<input id="rail" type="number" value="60"></label><label>Брой рафтове<input id="shelves" type="number" value="1"></label></div><div id="calc" class="calc"></div></section>
<section class="card"><h2>Конструкция — 3D модел</h2><p style="color:#687386;margin-top:-8px">2 царги · 4 крака · плотът е повдигнат, за да се вижда конструкцията</p>
<svg id="cabinet3d" viewBox="0 0 760 650" style="max-height:620px">
<defs><linearGradient id="woodFront" x1="0" x2="1"><stop offset="0" stop-color="#ead0a4"/><stop offset=".5" stop-color="#d7ad75"/><stop offset="1" stop-color="#c7955e"/></linearGradient><linearGradient id="woodSide" x1="0" x2="1"><stop offset="0" stop-color="#c99b66"/><stop offset="1" stop-color="#b67f4d"/></linearGradient></defs>
<!-- worktop exploded above cabinet -->
<polygon id="topFace" points="170,80 535,80 625,42 260,42" fill="url(#woodFront)" stroke="#4b3a2b" stroke-width="2"/>
<polygon points="170,80 535,80 535,102 170,102" fill="#c9945e" stroke="#4b3a2b" stroke-width="2"/>
<polygon points="535,80 625,42 625,64 535,102" fill="#a87345" stroke="#4b3a2b" stroke-width="2"/>
<text x="390" y="30" text-anchor="middle" font-size="15">Кухненски плот</text><text id="topL" x="640" y="72"></text>
<!-- rear rail -->
<polygon id="rearRail" points="232,150 510,150 574,123 296,123" fill="#d9b27d" stroke="#473729" stroke-width="2"/>
<!-- side panels -->
<polygon id="leftSide" points="190,170 232,150 232,505 190,530" fill="url(#woodFront)" stroke="#4b3a2b" stroke-width="2"/>
<polygon id="rightSide" points="510,150 552,170 552,530 510,505" fill="url(#woodSide)" stroke="#4b3a2b" stroke-width="2"/>
<!-- front rail -->
<polygon id="frontRail" points="190,170 510,150 552,170 232,191" fill="#e2bd88" stroke="#473729" stroke-width="2"/>
<text x="585" y="142" font-size="13">задна царга</text><text x="560" y="183" font-size="13">предна царга</text>
<!-- shelf -->
<polygon id="shelf3d" points="191,337 511,317 552,337 232,359" fill="url(#woodFront)" stroke="#5a4633" stroke-width="2"/>
<!-- bottom panel -->
<polygon id="bottom3d" points="190,530 510,505 552,530 232,558" fill="url(#woodFront)" stroke="#4b3a2b" stroke-width="2"/>
<polygon points="190,530 232,558 232,573 190,545" fill="#bc8753" stroke="#4b3a2b" stroke-width="2"/><polygon points="232,558 552,530 552,545 232,573" fill="#c7955e" stroke="#4b3a2b" stroke-width="2"/>
<!-- four legs, rear pair lighter -->
<g stroke="#2d2119" stroke-width="2"><rect x="218" y="548" width="17" height="64" fill="#4a3022" opacity=".58"/><rect x="510" y="524" width="17" height="64" fill="#4a3022" opacity=".58"/><rect x="197" y="544" width="19" height="72" fill="#392319"/><rect x="493" y="541" width="19" height="72" fill="#392319"/></g>
<!-- feet -->
<g fill="#21150f"><ellipse cx="206" cy="616" rx="13" ry="4"/><ellipse cx="502" cy="613" rx="13" ry="4"/><ellipse cx="226" cy="612" rx="11" ry="3" opacity=".55"/><ellipse cx="518" cy="588" rx="11" ry="3" opacity=".55"/></g>
<text id="wL" x="360" y="640" text-anchor="middle" font-size="16" font-weight="700"></text><text id="bodyL" x="145" y="350" text-anchor="middle" transform="rotate(-90 145 350)" font-size="15"></text><text id="legsL" x="550" y="590" font-size="14"></text>
</svg></section></div>
<section class="card" style="margin-top:18px"><h2>Кантиране</h2><div id="buttons" class="partBtns"></div><p>Натисни ръб — червено означава кант.</p><div style="display:grid;grid-template-columns:minmax(260px,500px) 1fr;gap:20px;align-items:center"><svg viewBox="0 0 430 280"><rect x="70" y="45" width="290" height="180" fill="#f3f5f7" stroke="#7b8794" stroke-width="2"/><line data-edge="top" x1="70" y1="45" x2="360" y2="45" class="edge"/><line data-edge="right" x1="360" y1="45" x2="360" y2="225" class="edge"/><line data-edge="bottom" x1="70" y1="225" x2="360" y2="225" class="edge"/><line data-edge="left" x1="70" y1="45" x2="70" y2="225" class="edge"/><text id="aL" x="215" y="258" text-anchor="middle"></text><text id="bL" x="30" y="140" text-anchor="middle" transform="rotate(-90 30 140)"></text></svg><div><h3 id="pname"></h3><div id="psize" style="font-size:24px;font-weight:800"></div><p id="etxt"></p><p id="meters" style="font-weight:800"></p></div></div></section>
<section class="card" style="margin-top:18px;overflow:auto"><h2>Списък за разкрой</h2><table><thead><tr><th>Детайл</th><th>Брой</th><th>Краен размер</th><th>Кантирани ръбове</th><th>Кант</th></tr></thead><tbody id="tbody"></tbody><tfoot><tr style="font-weight:800"><td colspan="4">ОБЩО КАНТ</td><td id="total"></td></tr></tfoot></table></section></main>
<script>const $=i=>document.getElementById(i),v=i=>Math.max(0,Number($(i).value)||0),N={top:'горе',right:'дясно',bottom:'долу',left:'ляво'};let sel='side';const E={side:new Set(),bottom:new Set(),shelf:new Set(),rail:new Set(),back:new Set()};function D(){let w=v('w'),total=v('h'),legs=v('legs'),top=v('top'),t=v('t'),d=v('d'),back=v('back'),rail=v('rail'),shelves=Math.round(v('shelves')),body=Math.max(0,total-legs-top),pd=Math.max(0,d-back),sideH=Math.max(0,body-t),inner=Math.max(0,w-2*t);return{w,total,legs,top,t,d,back,rail,shelves,body,pd,sideH,inner}}function P(x){return{side:{n:'Страница',q:2,a:x.sideH,b:x.pd},bottom:{n:'Дъно',q:1,a:x.w,b:x.pd},shelf:{n:'Рафт',q:x.shelves,a:x.inner,b:x.pd},rail:{n:'Царга',q:2,a:x.inner,b:x.rail},back:{n:'Гръб '+x.back+' mm',q:1,a:x.w,b:x.body}}}function M(k,p){let m=0;E[k].forEach(e=>m+=(e==='top'||e==='bottom'?p.a:p.b));return m*p.q/1000}function T(k){let a=[...E[k]].map(e=>N[e]);return a.length?a.join(', '):'няма'}function R(){let x=D(),p=P(x),q=p[sel];$('calc').innerHTML='<b>Корпус:</b> '+x.w+' × '+x.body+' × '+x.d+' mm<br><b>ПДЧ дълбочина:</b> '+x.pd+' mm<br><b>Страница:</b> '+x.sideH+' × '+x.pd+' mm<br><b>4 крака:</b> '+x.legs+' mm · <b>Плот:</b> '+x.top+' mm';$('topL').textContent=x.top+' mm';$('wL').textContent=x.w+' mm';$('bodyL').textContent='корпус '+x.body+' mm';$('legsL').textContent='4 × '+x.legs+' mm';$('buttons').innerHTML='';Object.entries(p).forEach(([k,z])=>{let b=document.createElement('button');b.textContent=z.n;b.className=k===sel?'active':'';b.onclick=()=>{sel=k;R()};$('buttons').appendChild(b)});$('pname').textContent=q.n;$('psize').textContent=q.a+' × '+q.b+' mm';$('aL').textContent=q.a+' mm';$('bL').textContent=q.b+' mm';$('etxt').textContent='Кант: '+T(sel);$('meters').textContent='Кант за '+q.q+' бр.: '+M(sel,q).toFixed(3)+' m';document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',E[sel].has(e.dataset.edge)));let total=0;$('tbody').innerHTML='';Object.entries(p).forEach(([k,z])=>{if(z.q<1)return;let m=M(k,z);total+=m;$('tbody').insertAdjacentHTML('beforeend','<tr><td>'+z.n+'</td><td>'+z.q+'</td><td>'+z.a+' × '+z.b+' mm</td><td>'+T(k)+'</td><td>'+m.toFixed(3)+' m</td></tr>')});$('total').textContent=total.toFixed(3)+' m'}document.querySelectorAll('input').forEach(e=>e.oninput=R);document.querySelectorAll('.edge').forEach(e=>e.onclick=()=>{let s=E[sel],k=e.dataset.edge;s.has(k)?s.delete(k):s.add(k);R()});R();</script></body></html>
