<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Calculator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fa;color:#18212f}header{background:#17263a;color:#fff;padding:20px}.wrap{max-width:1180px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border:1px solid #d7dde5;border-radius:14px;padding:16px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#687386}input{width:100%;padding:10px;border:1px solid #d7dde5;border-radius:8px;font-size:16px;margin-top:4px}.calc{margin-top:14px;background:#eef3f8;padding:12px;border-radius:10px;line-height:1.6}svg{width:100%;max-height:520px}.partBtns{display:flex;flex-wrap:wrap;gap:8px}.partBtns button{padding:9px 12px;border:1px solid #d7dde5;background:#fff;border-radius:8px}.partBtns button.active{border-color:#1565c0;background:#e8f1fc;font-weight:700}.edge{stroke:transparent;stroke-width:20;cursor:pointer;pointer-events:stroke}.edge.on{stroke:#e53935;stroke-width:10}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #d7dde5}th{background:#eef3f8}@media(max-width:780px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body>
<header><div class="wrap" style="padding:0"><h1 style="margin:0">Kitchen Calculator</h1><div>Долен кухненски шкаф — v0.4</div></div></header><main class="wrap"><div class="grid"><section class="card"><h2>Размери</h2><div class="inputs">
<label>Ширина шкаф<input id="w" type="number" value="600"></label><label>Обща височина<input id="h" type="number" value="900"></label><label>Крака<input id="legs" type="number" value="100"></label><label>Плот — дебелина<input id="top" type="number" value="39"></label><label>ПДЧ<input id="t" type="number" value="18"></label><label>Крайна дълбочина<input id="d" type="number" value="555"></label><label>Гръб<input id="back" type="number" value="3"></label><label>Ширина царги<input id="rail" type="number" value="60"></label><label>Брой рафтове<input id="shelves" type="number" value="1"></label></div><div id="calc" class="calc"></div></section>
<section class="card"><h2>Конструкция — истински 3D модел</h2><p style="color:#687386;margin-top:-8px">Влачи с мишката за завъртане · колелце за приближаване</p><div id="threeCabinet" style="height:610px;border-radius:10px;overflow:hidden;background:#f7f8fa"></div></section></div>
<section class="card" style="margin-top:18px"><h2>Кантиране</h2><div id="buttons" class="partBtns"></div><p>Натисни ръб — червено означава кант.</p><div style="display:grid;grid-template-columns:minmax(260px,500px) 1fr;gap:20px;align-items:center"><svg viewBox="0 0 430 280"><rect x="70" y="45" width="290" height="180" fill="#f3f5f7" stroke="#7b8794" stroke-width="2"/><line data-edge="top" x1="70" y1="45" x2="360" y2="45" class="edge"/><line data-edge="right" x1="360" y1="45" x2="360" y2="225" class="edge"/><line data-edge="bottom" x1="70" y1="225" x2="360" y2="225" class="edge"/><line data-edge="left" x1="70" y1="45" x2="70" y2="225" class="edge"/><text id="aL" x="215" y="258" text-anchor="middle"></text><text id="bL" x="30" y="140" text-anchor="middle" transform="rotate(-90 30 140)"></text></svg><div><h3 id="pname"></h3><div id="psize" style="font-size:24px;font-weight:800"></div><p id="etxt"></p><p id="meters" style="font-weight:800"></p></div></div></section>
<section class="card" style="margin-top:18px;overflow:auto"><h2>Списък за разкрой</h2><table><thead><tr><th>Детайл</th><th>Брой</th><th>Краен размер</th><th>Кантирани ръбове</th><th>Кант</th></tr></thead><tbody id="tbody"></tbody><tfoot><tr style="font-weight:800"><td colspan="4">ОБЩО КАНТ</td><td id="total"></td></tr></tfoot></table></section></main>
<script>const $=i=>document.getElementById(i),v=i=>Math.max(0,Number($(i).value)||0),N={top:'горе',right:'дясно',bottom:'долу',left:'ляво'};let sel='side';const E={side:new Set(),bottom:new Set(),shelf:new Set(),rail:new Set(),back:new Set()};function D(){let w=v('w'),total=v('h'),legs=v('legs'),top=v('top'),t=v('t'),d=v('d'),back=v('back'),rail=v('rail'),shelves=Math.round(v('shelves')),body=Math.max(0,total-legs-top),pd=Math.max(0,d-back),sideH=Math.max(0,body-t),inner=Math.max(0,w-2*t);return{w,total,legs,top,t,d,back,rail,shelves,body,pd,sideH,inner}}function P(x){return{side:{n:'Страница',q:2,a:x.sideH,b:x.pd},bottom:{n:'Дъно',q:1,a:x.w,b:x.pd},shelf:{n:'Рафт',q:x.shelves,a:x.inner,b:x.pd},rail:{n:'Царга',q:2,a:x.inner,b:x.rail},back:{n:'Гръб '+x.back+' mm',q:1,a:x.w,b:x.body}}}function M(k,p){let m=0;E[k].forEach(e=>m+=(e==='top'||e==='bottom'?p.a:p.b));return m*p.q/1000}function T(k){let a=[...E[k]].map(e=>N[e]);return a.length?a.join(', '):'няма'}function R(){let x=D(),p=P(x),q=p[sel];$('calc').innerHTML='<b>Корпус:</b> '+x.w+' × '+x.body+' × '+x.d+' mm<br><b>ПДЧ дълбочина:</b> '+x.pd+' mm<br><b>Страница:</b> '+x.sideH+' × '+x.pd+' mm<br><b>4 крака:</b> '+x.legs+' mm · <b>Плот:</b> '+x.top+' mm';$('buttons').innerHTML='';Object.entries(p).forEach(([k,z])=>{let b=document.createElement('button');b.textContent=z.n;b.className=k===sel?'active':'';b.onclick=()=>{sel=k;R()};$('buttons').appendChild(b)});$('pname').textContent=q.n;$('psize').textContent=q.a+' × '+q.b+' mm';$('aL').textContent=q.a+' mm';$('bL').textContent=q.b+' mm';$('etxt').textContent='Кант: '+T(sel);$('meters').textContent='Кант за '+q.q+' бр.: '+M(sel,q).toFixed(3)+' m';document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',E[sel].has(e.dataset.edge)));let total=0;$('tbody').innerHTML='';Object.entries(p).forEach(([k,z])=>{if(z.q<1)return;let m=M(k,z);total+=m;$('tbody').insertAdjacentHTML('beforeend','<tr><td>'+z.n+'</td><td>'+z.q+'</td><td>'+z.a+' × '+z.b+' mm</td><td>'+T(k)+'</td><td>'+m.toFixed(3)+' m</td></tr>')});$('total').textContent=total.toFixed(3)+' m'}document.querySelectorAll('input').forEach(e=>e.oninput=R);document.querySelectorAll('.edge').forEach(e=>e.onclick=()=>{let s=E[sel],k=e.dataset.edge;s.has(k)?s.delete(k):s.add(k);R()});R();</script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script>
(function(){
const host=document.getElementById('threeCabinet');
if(!host||!window.THREE){host.innerHTML='<div style="padding:30px;color:#b91c1c">3D библиотеката не се зареди.</div>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf7f8fa);
const camera=new THREE.PerspectiveCamera(38,1,1,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(600,1000,700);scene.add(dl);

const wood=new THREE.MeshStandardMaterial({color:0xd7ad75,roughness:.7}),edge=new THREE.MeshStandardMaterial({color:0xb77d48,roughness:.75}),dark=new THREE.MeshStandardMaterial({color:0x3b2a22,roughness:.8}),backMat=new THREE.MeshStandardMaterial({color:0xc9a879,roughness:.85});
let group=new THREE.Group();scene.add(group);
function box(w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||wood);m.position.set(x,y,z);group.add(m);return m}
function n(id){return Math.max(0,Number(document.getElementById(id)?.value)||0)}
function rebuild(){while(group.children.length)group.remove(group.children[0]);const W=n('w'),total=n('h'),L=n('legs'),top=n('top'),T=n('t'),D=n('d'),B=n('back'),R=n('rail'),sh=Math.round(n('shelves'));const H=Math.max(0,total-L-top),PD=Math.max(0,D-B),sideH=Math.max(0,H-T),inner=Math.max(0,W-2*T);box(W,T,PD,0,L+T/2,0);box(T,sideH,PD,-W/2+T/2,L+T+sideH/2,0);box(T,sideH,PD,W/2-T/2,L+T+sideH/2,0);for(let i=1;i<=sh;i++)box(inner,T,PD,0,L+T+sideH*i/(sh+1),0);const ry=L+H-T/2;box(inner,T,R,0,ry,PD/2-R/2,edge);box(inner,T,R,0,ry,-PD/2+R/2,edge);if(B)box(W,H,B,0,L+H/2,-PD/2-B/2,backMat);const lw=42,ins=55;[[-1,1],[1,1],[-1,-1],[1,-1]].forEach(p=>box(lw,L,lw,p[0]*(W/2-ins),L/2,p[1]*(PD/2-ins),dark));box(W+70,top,D+35,0,L+H+55+top/2,10);camera.position.set(W*1.45,L+H*.95,Math.max(D*2.0,900));camera.lookAt(0,L+H*.52,0);camera.updateProjectionMatrix();}
let dragging=false,lastX=0,lastY=0,rx=-0.12,ry=-0.45,zoom=1;
function apply(){group.rotation.x=rx;group.rotation.y=ry;group.scale.setScalar(zoom)}
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;ry+=(e.clientX-lastX)*.008;rx+=(e.clientY-lastY)*.006;rx=Math.max(-.8,Math.min(.5,rx));lastX=e.clientX;lastY=e.clientY;apply()});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY>0?.92:1.08;zoom=Math.max(.55,Math.min(1.7,zoom));apply()},{passive:false});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(host);resize();rebuild();apply();['w','h','legs','top','t','d','back','rail','shelves'].forEach(id=>document.getElementById(id)?.addEventListener('input',rebuild));
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
})();
</script></body></html>
